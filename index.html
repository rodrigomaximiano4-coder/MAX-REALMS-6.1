<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a4a75" />
  <title>Fronteira de Ferro: A Fuga</title>
  <style>
    :root {
      --bg-light: #4a7fb5;
      --bg-dark: #2a4a75;
      --text: #ffffff;
      --accent: #ffd76a;
      --accent-2: #ffb84d;
      --success: #87f3a5;
      --danger: #ff7171;
      --shadow: rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-light) 0%, var(--bg-dark) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      touch-action: none;
    }

    #game-root {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #5a8cc5 0%, #2a4a75 50%, #1a2a45 100%);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: auto;
    }

    .panel {
      background: rgba(30, 50, 80, 0.85);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px var(--shadow);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .stats {
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
    }

    .value { 
      color: var(--accent);
      font-weight: 800;
    }

    .biome {
      min-width: 240px;
      text-align: right;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.5;
    }

    .phase-map-wrap {
      position: absolute;
      right: 16px;
      top: 130px;
      width: min(280px, 36vw);
      pointer-events: auto;
    }

    .phase-map-wrap h3 {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .phase-map {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .phase-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .phase-item.active {
      background: rgba(122, 215, 255, 0.18);
      border-color: rgba(122, 215, 255, 0.4);
      color: #e8fbff;
    }

    .phase-item.done {
      background: rgba(126, 240, 161, 0.12);
      border-color: rgba(126, 240, 161, 0.25);
    }

    .phase-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .phase-item.active .phase-dot,
    .phase-item.done .phase-dot {
      background: var(--success);
    }

    .controls {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 30;
    }

    .lane-controls,
    .action-controls {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn {
      appearance: none;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(30, 50, 80, 0.8);
      color: white;
      cursor: pointer;
      transition: all 0.12s ease;
      touch-action: manipulation;
      font-weight: 700;
    }

    .btn:hover {
      border-color: rgba(255,255,255,0.5);
      background: rgba(40, 60, 90, 0.9);
    }

    .btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .lane-btn {
      width: 64px;
      height: 48px;
      border-radius: 14px;
      font-size: 1.2rem;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      font-size: 1.4rem;
      box-shadow: 0 6px 20px var(--shadow);
    }

    .gameover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 35, 60, 0.65);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 60;
    }

    .gameover.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .gameover-card {
      width: min(90vw, 450px);
      padding: 32px 28px;
      border-radius: 24px;
      background: rgba(30, 50, 80, 0.95);
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 24px 48px var(--shadow);
      text-align: center;
    }

    .gameover-card h2 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--danger);
    }

    .gameover-card p {
      margin: 0 0 24px;
      color: rgba(255,255,255,0.95);
      line-height: 1.6;
      font-size: 1rem;
    }

    .restart-btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1410;
      padding: 13px 24px;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 215, 106, 0.3);
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 215, 106, 0.4);
    }

    .restart-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 860px) {
      .phase-map-wrap { 
        right: 12px; 
        top: 120px; 
        width: min(220px, 38vw); 
      }
    }

    @media (max-width: 640px) {
      .topbar { 
        left: 12px; 
        right: 12px; 
        top: 12px; 
        gap: 8px;
      }
      .stats { min-width: 180px; }
      .stats-row { font-size: 11px; }
      .biome { min-width: 160px; font-size: 10px; }
      .phase-map-wrap { display: none; }
      .controls { left: 12px; right: 12px; bottom: 12px; }
      .lane-btn { width: 56px; height: 44px; font-size: 1rem; }
      .action-btn { width: 52px; height: 52px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div id="game-root"></div>

  <div class="ui">
    <div class="topbar">
      <div class="panel stats">
        <div class="stats-row"><span>Pontos</span><span class="value" id="scoreValue">0</span></div>
        <div class="stats-row"><span>Distância</span><span class="value" id="distanceValue">0 m</span></div>
        <div class="stats-row"><span>Vidas</span><span class="value" id="livesValue">3</span></div>
      </div>
      <div class="panel biome" id="biomeValue">Centro Urbano em Ruínas</div>
    </div>

    <div class="phase-map-wrap panel" id="phaseMapWrap">
      <h3>Mapa de fases</h3>
      <div id="phaseMap" class="phase-map"></div>
    </div>

    <div class="gameover" id="gameoverPanel">
      <div class="gameover-card">
        <h2>Perdeu o ritmo</h2>
        <p id="resultText">Sua fuga foi interrompida.</p>
        <button class="restart-btn" id="restartBtn">Reiniciar fuga</button>
      </div>
    </div>

    <div class="controls">
      <div class="lane-controls">
        <button class="btn lane-btn" data-lane="0">◀</button>
        <button class="btn lane-btn" data-lane="1">●</button>
        <button class="btn lane-btn" data-lane="2">▶</button>
      </div>
      <div class="action-controls">
        <button class="btn action-btn" id="jumpBtn">▲</button>
        <button class="btn action-btn" id="slideBtn">▼</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const STORAGE_KEY = 'fronteira_ferro_records_v1';
    const lanePositions = [-1.8, 0, 1.8];
    
    const DEFAULT_CONFIG = {
      biomas: [
        { id: 0, nome: 'Centro Urbano em Ruínas', distanciaInicio: 0, distanciaFim: 1500, velocidadeMultiplicador: 1.0 },
        { id: 1, nome: 'Favela em Conflito', distanciaInicio: 1500, distanciaFim: 3500, velocidadeMultiplicador: 1.15 },
        { id: 2, nome: 'Fronteira Gelada', distanciaInicio: 3500, distanciaFim: 5500, velocidadeMultiplicador: 1.3 },
        { id: 3, nome: 'Trincheiras de Guerra', distanciaInicio: 5500, distanciaFim: 7500, velocidadeMultiplicador: 1.45 },
        { id: 4, nome: 'Deserto de Esperança', distanciaInicio: 7500, distanciaFim: Infinity, velocidadeMultiplicador: 1.6 }
      ],
      configuracoes: {
        vidasIniciais: 3,
        velocidadeInicial: 0.15,
        aceleracao: 0.00005,
        velocidadeMaxima: 0.35,
        gravidade: 0.008,
        saltoForce: 0.18
      }
    };

    let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

    const state = {
      score: 0,
      distance: 0,
      lives: 3,
      hasStarted: false,
      isGameOver: false,
      currentBiomeIndex: 0,
      playerLane: 1,
      playerY: 0,
      verticalVelocity: 0,
      grounded: true,
      sliding: false,
      currentSpeed: 0.15,
      worldTime: 0,
      spawnTimer: 0,
      animationId: null
    };

    const world = {
      scene: null,
      camera: null,
      renderer: null,
      player: null,
      obstacles: [],
      pickups: [],
      playerParts: {}
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getBiomeAtDistance(dist) {
      for (const biome of config.biomas) {
        if (dist >= biome.distanciaInicio && dist < (biome.distanciaFim || Infinity)) {
          return biome;
        }
      }
      return config.biomas[config.biomas.length - 1];
    }

    function renderPhaseMap() {
      const phaseList = document.getElementById('phaseMap');
      if (!phaseList) return;
      phaseList.innerHTML = '';

      config.biomas.forEach((bioma, index) => {
        const item = document.createElement('div');
        const isActive = state.currentBiomeIndex === index;
        const isDone = index < state.currentBiomeIndex;
        item.className = `phase-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`;
        item.innerHTML = `
          <span class="phase-dot"></span>
          <span>${bioma.nome}</span>
          <span>${Math.floor(bioma.distanciaInicio / 100)}km</span>
        `;
        phaseList.appendChild(item);
      });
    }

    function updateHud() {
      document.getElementById('scoreValue').textContent = Math.floor(state.score);
      document.getElementById('distanceValue').textContent = Math.floor(state.distance) + ' m';
      document.getElementById('livesValue').textContent = state.lives;
      const biome = getBiomeAtDistance(state.distance);
      document.getElementById('biomeValue').textContent = biome.nome;
    }

    async function loadConfig() {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2200);
        const response = await fetch('./dados.json', { cache: 'no-store', signal: controller.signal });
        clearTimeout(timer);
        if (response.ok) {
          const loaded = await response.json();
          if (loaded.biomas && loaded.biomas.length > 0) {
            config.biomas = loaded.biomas;
          }
          if (loaded.configuracoes) {
            Object.assign(config.configuracoes, loaded.configuracoes);
          }
        }
      } catch (err) {
        console.warn('Falha ao carregar dados.json. Usando fallback.');
      }
    }

    function setupScene() {
      const root = document.getElementById('game-root');
      if (!root) return;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x4a7fb5);
      scene.fog = new THREE.Fog(0x3a6a9d, 25, 100);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 3.5, 8);
      camera.lookAt(0, 1.2, -20);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      root.appendChild(renderer.domElement);

      const ambientLight = new THREE.HemisphereLight(0xd0e8ff, 0x2d4a75, 1.3);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xfef5e7, 1.6);
      directionalLight.position.set(8, 12, 5);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 2048;
      directionalLight.shadow.mapSize.height = 2048;
      directionalLight.shadow.camera.far = 100;
      scene.add(directionalLight);

      // Ground
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 300),
        new THREE.MeshStandardMaterial({ color: 0x3a5a7f, roughness: 0.7 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      scene.add(ground);

      // Road
      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(8.5, 300),
        new THREE.MeshStandardMaterial({ color: 0x2a4a65, roughness: 0.8 })
      );
      road.rotation.x = -Math.PI / 2;
      road.position.y = 0.01;
      road.receiveShadow = true;
      scene.add(road);

      // Lane lines
      const lineGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < 3; i++) {
        const points = [
          new THREE.Vector3(lanePositions[i], 0.05, 100),
          new THREE.Vector3(lanePositions[i], 0.05, -200)
        ];
        lineGeometry.setFromPoints(points);
        const line = new THREE.Line(
          lineGeometry,
          new THREE.LineBasicMaterial({ color: 0xf9e0a8, linewidth: 2 })
        );
        scene.add(line);
      }

      // Sky
      const skyGeometry = new THREE.SphereGeometry(200, 32, 32);
      const skyMaterial = new THREE.MeshBasicMaterial({
        color: 0x5a8cc5,
        side: THREE.BackSide
      });
      const sky = new THREE.Mesh(skyGeometry, skyMaterial);
      scene.add(sky);

      // Building Blocks
      for (let i = 0; i < 8; i++) {
        const w = 1.5 + Math.random() * 2;
        const h = 4 + Math.random() * 8;
        const d = 1.5 + Math.random() * 2;
        const block = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({ color: 0x546a8a, roughness: 0.8 })
        );
        block.position.set(
          (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3),
          h / 2,
          -50 + Math.random() * 80
        );
        block.castShadow = true;
        block.receiveShadow = true;
        scene.add(block);
      }

      world.scene = scene;
      world.camera = camera;
      world.renderer = renderer;

      createPlayer();
      updateHud();
      renderPhaseMap();
    }

    function createPlayer() {
      const group = new THREE.Group();
      group.position.set(0, 0, 3);

      // ====== HEAD ======
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xf0b5a0 })
      );
      head.position.y = 1.95;
      head.castShadow = true;
      group.add(head);

      // Eyes
      const eyeGeometry = new THREE.SphereGeometry(0.07, 8, 8);
      const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
      const eyeL = new THREE.Mesh(eyeGeometry, eyeMaterial);
      eyeL.position.set(-0.08, 2.02, 0.22);
      group.add(eyeL);
      const eyeR = new THREE.Mesh(eyeGeometry, eyeMaterial);
      eyeR.position.set(0.08, 2.02, 0.22);
      group.add(eyeR);

      // ====== BODY ======
      // Torso (pele)
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.8, 0.35),
        new THREE.MeshStandardMaterial({ color: 0xf0b5a0 })
      );
      torso.position.y = 1.2;
      torso.castShadow = true;
      group.add(torso);

      // Camiseta larga azul/verde
      const shirt = new THREE.Mesh(
        new THREE.BoxGeometry(0.75, 0.95, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x2d5a3d })
      );
      shirt.position.y = 1.1;
      shirt.position.z = 0.05;
      shirt.castShadow = true;
      group.add(shirt);

      // Texto "Rodrigo" na camiseta
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffd76a';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Rodrigo', 128, 64);
      
      const texture = new THREE.CanvasTexture(canvas);
      const shirtMaterial = new THREE.MeshStandardMaterial({ map: texture, color: 0x2d5a3d });
      const shirtFront = new THREE.Mesh(
        new THREE.PlaneGeometry(0.73, 0.93),
        shirtMaterial
      );
      shirtFront.position.set(0, 1.1, 0.225);
      group.add(shirtFront);

      // ====== BRAÇOS ======
      // Braço esquerdo
      const armL = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.85, 0.14),
        new THREE.MeshStandardMaterial({ color: 0xf0b5a0 })
      );
      armL.position.set(-0.45, 1.2, 0);
      armL.castShadow = true;
      group.add(armL);

      // Braço direito
      const armR = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.85, 0.14),
        new THREE.MeshStandardMaterial({ color: 0xf0b5a0 })
      );
      armR.position.set(0.45, 1.2, 0);
      armR.castShadow = true;
      group.add(armR);

      // ====== SHORTS ======
      const shorts = new THREE.Mesh(
        new THREE.BoxGeometry(0.68, 0.55, 0.38),
        new THREE.MeshStandardMaterial({ color: 0x4a3f35 })
      );
      shorts.position.y = 0.62;
      shorts.castShadow = true;
      group.add(shorts);

      // ====== PERNAS ======
      // Perna esquerda
      const legL = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.85, 0.16),
        new THREE.MeshStandardMaterial({ color: 0xf0b5a0 })
      );
      legL.position.set(-0.2, 0.35, 0);
      legL.castShadow = true;
      group.add(legL);

      // Perna direita
      const legR = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.85, 0.16),
        new THREE.MeshStandardMaterial({ color: 0xf0b5a0 })
      );
      legR.position.set(0.2, 0.35, 0);
      legR.castShadow = true;
      group.add(legR);

      world.playerParts = { armL, armR, legL, legR, shirt, shorts };
      world.scene.add(group);
      world.player = group;
    }

    function updatePlayerAnimation() {
      if (!world.player) return;

      const targetX = lanePositions[state.playerLane];
      world.player.position.x += (targetX - world.player.position.x) * 0.12;
      
      // Movimento vertical com pulo
      world.player.position.y = state.playerY;

      // Pernas correm suavemente sem tremer
      const legSpeed = 8;
      const legAngle = Math.sin(state.worldTime * 0.02 * legSpeed) * 0.4;
      world.playerParts.legL.rotation.x = legAngle;
      world.playerParts.legR.rotation.x = -legAngle;

      // Braços acompanham as pernas
      world.playerParts.armL.rotation.x = -legAngle * 0.6;
      world.playerParts.armR.rotation.x = legAngle * 0.6;

      // Slide
      if (state.sliding) {
        world.playerParts.shirt.position.y = 0.85;
      } else {
        world.playerParts.shirt.position.y = 1.1;
      }
    }

    function jump() {
      if (!state.grounded) return;
      state.grounded = false;
      state.verticalVelocity = config.configuracoes.saltoForce;
    }

    function slide() {
      if (!state.grounded) return;
      state.sliding = true;
      setTimeout(() => { state.sliding = false; }, 350);
    }

    function applyPhysics(dt) {
      const gravity = config.configuracoes.gravidade;
      state.verticalVelocity -= gravity;
      state.playerY += state.verticalVelocity;

      if (state.playerY <= 0) {
        state.playerY = 0;
        state.verticalVelocity = 0;
        state.grounded = true;
      }
    }

    function createObstacle() {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 1.3, 0.8),
        new THREE.MeshStandardMaterial({ color: 0xd94a4a })
      );
      mesh.position.set(lanePositions[Math.floor(Math.random() * 3)], 0.65, -60);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      world.scene.add(mesh);
      world.obstacles.push({ mesh, z: mesh.position.z });
    }

    function createPickup() {
      const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.32, 2),
        new THREE.MeshStandardMaterial({ color: 0xffd76a, emissive: 0x8a6f00 })
      );
      mesh.position.set(lanePositions[Math.floor(Math.random() * 3)], 1.5, -60);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      world.scene.add(mesh);
      world.pickups.push({ mesh, z: mesh.position.z });
    }

    function gameOver() {
      state.isGameOver = true;
      const panel = document.getElementById('gameoverPanel');
      panel.classList.add('active');
      const resultText = document.getElementById('resultText');
      resultText.textContent = `Você chegou a ${Math.floor(state.distance)}m e fez ${Math.floor(state.score)} pontos!`;
    }

    function resetGame() {
      state.score = 0;
      state.distance = 0;
      state.lives = 3;
      state.hasStarted = false;
      state.isGameOver = false;
      state.currentBiomeIndex = 0;
      state.playerLane = 1;
      state.playerY = 0;
      state.verticalVelocity = 0;
      state.grounded = true;
      state.sliding = false;
      state.worldTime = 0;
      state.spawnTimer = 0;

      // Remover obstáculos e pickups
      world.obstacles.forEach(o => world.scene.remove(o.mesh));
      world.pickups.forEach(p => world.scene.remove(p.mesh));
      world.obstacles = [];
      world.pickups = [];

      document.getElementById('gameoverPanel').classList.remove('active');
      updateHud();
      renderPhaseMap();
    }

    function animate(timestamp) {
      if (!state.hasStarted) {
        if (world.renderer && world.scene && world.camera) {
          world.renderer.render(world.scene, world.camera);
        }
        state.animationId = requestAnimationFrame(animate);
        return;
      }

      const dt = 1 / 60;
      state.worldTime += dt * 1000;
      state.spawnTimer += dt * 1000;

      const biome = getBiomeAtDistance(state.distance);
      state.currentSpeed = config.configuracoes.velocidadeInicial * biome.velocidadeMultiplicador;
      state.distance += state.currentSpeed * dt * 100;
      state.score += state.currentSpeed * dt * 10;

      const newBiomeIndex = config.biomas.findIndex(b => 
        state.distance >= b.distanciaInicio && state.distance < (b.distanciaFim || Infinity)
      );
      if (newBiomeIndex >= 0) state.currentBiomeIndex = newBiomeIndex;

      applyPhysics(dt);
      updatePlayerAnimation();
      updateHud();
      renderPhaseMap();

      // Spawn obstáculos e pickups
      if (state.spawnTimer > 1200) {
        state.spawnTimer = 0;
        if (Math.random() > 0.35) createObstacle();
        if (Math.random() > 0.6) createPickup();
      }

      // Update obstacles
      for (let i = world.obstacles.length - 1; i >= 0; i--) {
        const obs = world.obstacles[i];
        obs.mesh.position.z += state.currentSpeed * dt * 10;
        obs.mesh.rotation.y += 0.02;

        if (obs.mesh.position.z > 10) {
          world.scene.remove(obs.mesh);
          world.obstacles.splice(i, 1);
          continue;
        }

        const dx = Math.abs(obs.mesh.position.x - world.player.position.x);
        const dz = Math.abs(obs.mesh.position.z - world.player.position.z);
        if (dx < 0.95 && dz < 1.3 && world.player.position.y < 1.2) {
          state.lives--;
          world.scene.remove(obs.mesh);
          world.obstacles.splice(i, 1);
          if (state.lives <= 0) {
            gameOver();
            state.animationId = requestAnimationFrame(animate);
            return;
          }
        }
      }

      // Update pickups
      for (let i = world.pickups.length - 1; i >= 0; i--) {
        const pickup = world.pickups[i];
        pickup.mesh.position.z += state.currentSpeed * dt * 10;
        pickup.mesh.rotation.y += 0.15;
        pickup.mesh.position.y += Math.sin(state.worldTime * 0.005 + i) * 0.008;

        if (pickup.mesh.position.z > 10) {
          world.scene.remove(pickup.mesh);
          world.pickups.splice(i, 1);
          continue;
        }

        const dx = Math.abs(pickup.mesh.position.x - world.player.position.x);
        const dz = Math.abs(pickup.mesh.position.z - world.player.position.z);
        if (dx < 0.95 && dz < 1.2) {
          state.score += 50;
          world.scene.remove(pickup.mesh);
          world.pickups.splice(i, 1);
        }
      }

      if (world.renderer && world.scene && world.camera) {
        world.renderer.render(world.scene, world.camera);
      }

      state.animationId = requestAnimationFrame(animate);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadConfig();
      setupScene();
      updateHud();
      renderPhaseMap();

      // Start game immediately
      state.hasStarted = true;
      state.score = 0;
      state.distance = 0;
      state.lives = 3;
      state.playerLane = 1;
      state.playerY = 0;
      state.grounded = true;

      // Button listeners
      document.getElementById('restartBtn').addEventListener('click', () => {
        resetGame();
        state.hasStarted = true;
      });

      document.querySelectorAll('.lane-btn').forEach(button => {
        button.addEventListener('click', () => {
          if (state.hasStarted) {
            state.playerLane = clamp(Number(button.dataset.lane), 0, 2);
          }
        });
      });

      document.getElementById('jumpBtn').addEventListener('click', () => {
        if (state.hasStarted) jump();
      });

      document.getElementById('slideBtn').addEventListener('click', () => {
        if (state.hasStarted) slide();
      });

      document.addEventListener('keydown', (e) => {
        if (!state.hasStarted) return;
        if (e.key === 'ArrowLeft' || e.key === 'a') state.playerLane = clamp(state.playerLane - 1, 0, 2);
        if (e.key === 'ArrowRight' || e.key === 'd') state.playerLane = clamp(state.playerLane + 1, 0, 2);
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jump();
        if (e.key === 'ArrowDown' || e.key === 's') slide();
      });

      state.animationId = requestAnimationFrame(animate);
    });

    window.addEventListener('resize', () => {
      if (world.camera && world.renderer) {
        world.camera.aspect = window.innerWidth / window.innerHeight;
        world.camera.updateProjectionMatrix();
        world.renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
